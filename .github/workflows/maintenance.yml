name: Analisis de mantenimiento (sin escrituras)

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      steps:
        description: 'Pasos a analizar'
        type: string
        default: 'adult,size,dead,normalize,enrich,dedupe'

# Compartido con apply: no analizar y aplicar simultáneamente desde Actions.
concurrency:
  group: torrents-maintenance
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: maintenance-scan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Analizar con credencial de solo lectura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DRY_RUN: 'true'
          STEPS: ${{ inputs.steps || 'adult,size,dead,normalize,enrich,dedupe' }}
          MAX_DELETE_RATIO: ${{ vars.MAX_DELETE_RATIO || '0.1' }}
          MAX_DELETE_ROWS: ${{ vars.MAX_DELETE_ROWS || '1000' }}
          DEDUPE_OTHER_LANGUAGES: ${{ vars.DEDUPE_OTHER_LANGUAGES || 'keep' }}
          ENRICH_MAX_TITLES: ${{ vars.ENRICH_MAX_TITLES || '0' }}
          ENRICH_MAX_MINUTES: ${{ vars.ENRICH_MAX_MINUTES || '45' }}
          ADULT_EXTRA_KEYWORDS: ${{ vars.ADULT_EXTRA_KEYWORDS }}
        run: npm start
      - name: Conservar auditoria (incluso ante fallo)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit/*.jsonl
          retention-days: 30
          if-no-files-found: warn
